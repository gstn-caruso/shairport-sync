name: AirPlay 2 Linux PulseAudio
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cmake:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      ASDF_DATA_DIR: /opt/asdf
    steps:
      - name: Install C++26 build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git cmake ninja-build gcc-15 g++-15 g++ python3 pkg-config libpopt-dev libconfig-dev libpulse-dev libavahi-client-dev libssl-dev libplist-dev libplist-utils libsodium-dev libgcrypt20-dev uuid-dev libavutil-dev libavcodec-dev libavformat-dev libswresample-dev xxd
      - uses: actions/checkout@v4
      - name: Install asdf
        run: |
          curl -fsSL https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-linux-amd64.tar.gz -o /tmp/asdf.tar.gz
          tar -xzf /tmp/asdf.tar.gz -C /usr/local/bin asdf
      - uses: actions/cache@v4
        with:
          path: /opt/asdf
          key: clang-23.1.3-ubuntu26.04-libstdcxx15-v2
      - name: Install pinned Clang
        run: |
          if ! asdf plugin list | grep -qx clang; then
            asdf plugin add clang https://github.com/higebu/asdf-llvm.git
          fi
          git -C /opt/asdf/plugins/clang checkout b7b8dd389c790237145e7436f1cd85b49611e37e
          sed -i 's/ninja -C build $TOOL_NAME/ninja -C build -j2 $TOOL_NAME/' /opt/asdf/plugins/clang/lib/utils.bash
          asdf install
          asdf reshim clang
          echo /opt/asdf/shims >> "$GITHUB_PATH"
      - name: CMake build, contracts and staged install
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_SYSCONFDIR=/etc
          cmake --build build/cmake --parallel 2
          ctest --test-dir build/cmake --output-on-failure
          DESTDIR="$PWD/build/cmake/stage" cmake --install build/cmake
          test -f build/cmake/stage/usr/local/bin/shairport-sync
          test -f build/cmake/stage/usr/local/share/man/man1/shairport-sync.1
          test -f build/cmake/stage/etc/shairport-sync.conf.sample
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config libpopt-dev libconfig-dev libpulse-dev libavahi-client-dev libssl-dev libplist-dev libplist-utils libsodium-dev libgcrypt20-dev uuid-dev libavutil-dev libavcodec-dev libavformat-dev libswresample-dev xxd
      - name: Out-of-tree build and contracts
        run: |
          autoreconf -fi
          mkdir build
          cd build
          ../configure
          make -j2
          make check -j2
          make DESTDIR="$PWD/stage" install
          test -f stage/usr/local/bin/shairport-sync
          test -f stage/usr/local/etc/shairport-sync.conf.sample
      - name: In-tree build
        run: |
          ./configure
          make -j2
          make check -j2
