name: AirPlay 2 Linux PulseAudio
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cmake:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 15
    env:
      ASDF_DATA_DIR: /opt/asdf
    steps:
      - name: Install C++26 build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git cmake ninja-build gcc-15 g++-15 g++ zstd pkg-config libpopt-dev libconfig-dev libpulse-dev libavahi-client-dev libssl-dev libplist-dev libplist-utils libsodium-dev libgcrypt20-dev uuid-dev libavutil-dev libavcodec-dev libavformat-dev libswresample-dev xxd
      - uses: actions/checkout@v4
      - name: Install asdf
        run: |
          curl -fsSL https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-linux-amd64.tar.gz -o /tmp/asdf.tar.gz
          tar -xzf /tmp/asdf.tar.gz -C /usr/local/bin asdf
      - uses: actions/cache@v4
        id: llvm-cache
        with:
          path: /opt/asdf/installs/clang/23.1.3
          key: llvm-23.1.3-linux-x64-14d2f701eb68-v1
      - name: Install official LLVM binaries
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst -o /tmp/llvm.tar.zst
          printf '%s  %s\n' '14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba' /tmp/llvm.tar.zst | sha256sum --check
          mkdir -p /opt/asdf/installs/clang/23.1.3
          tar --use-compress-program='zstd --decompress --long=30' --extract --file /tmp/llvm.tar.zst --directory /opt/asdf/installs/clang/23.1.3 --strip-components=1 LLVM-23.1.3-Linux-X64/bin/clang LLVM-23.1.3-Linux-X64/bin/clang++ LLVM-23.1.3-Linux-X64/bin/clang-23 LLVM-23.1.3-Linux-X64/lib/clang LLVM-23.1.3-Linux-X64/include/llvm/Support/LICENSE.TXT
      - name: Register pinned Clang with asdf
        run: |
          if ! asdf plugin list | grep -qx clang; then
            asdf plugin add clang https://github.com/higebu/asdf-llvm.git
          fi
          git -C /opt/asdf/plugins/clang checkout b7b8dd389c790237145e7436f1cd85b49611e37e
          asdf reshim clang
          asdf which clang++
          asdf exec clang++ --version
          echo /opt/asdf/shims >> "$GITHUB_PATH"
      - name: CMake build, contracts and staged install
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_SYSCONFDIR=/etc
          cmake --build build/cmake --parallel 2
          ctest --test-dir build/cmake --output-on-failure
          DESTDIR="$PWD/build/cmake/stage" cmake --install build/cmake
          test -f build/cmake/stage/usr/local/bin/shairport-sync
          test -f build/cmake/stage/usr/local/share/man/man1/shairport-sync.1
          test -f build/cmake/stage/etc/shairport-sync.conf.sample
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config libpopt-dev libconfig-dev libpulse-dev libavahi-client-dev libssl-dev libplist-dev libplist-utils libsodium-dev libgcrypt20-dev uuid-dev libavutil-dev libavcodec-dev libavformat-dev libswresample-dev xxd
      - name: Out-of-tree build and contracts
        run: |
          autoreconf -fi
          mkdir build
          cd build
          ../configure
          make -j2
          make check -j2
          make DESTDIR="$PWD/stage" install
          test -f stage/usr/local/bin/shairport-sync
          test -f stage/usr/local/etc/shairport-sync.conf.sample
      - name: In-tree build
        run: |
          ./configure
          make -j2
          make check -j2
