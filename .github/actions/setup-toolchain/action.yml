name: Set up pinned C++26 toolchain
description: Install and register the verified LLVM archive with asdf
runs:
  using: composite
  steps:
    - name: Install asdf
      shell: bash
      run: |
        curl -fsSL https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-linux-amd64.tar.gz -o /tmp/asdf.tar.gz
        tar -xzf /tmp/asdf.tar.gz -C /usr/local/bin asdf
    - uses: actions/cache@v4
      id: llvm-cache
      with:
        path: /opt/asdf/installs/clang/23.1.3
        key: llvm-23.1.3-linux-x64-14d2f701eb68-v1
    - name: Install official LLVM binaries
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl --fail --silent --show-error --location --retry 3 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst -o /tmp/llvm.tar.zst
        printf '%s  %s\n' '14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba' /tmp/llvm.tar.zst | sha256sum --check
        mkdir -p /opt/asdf/installs/clang/23.1.3
        tar --use-compress-program='zstd --decompress --long=30' --extract --file /tmp/llvm.tar.zst --directory /opt/asdf/installs/clang/23.1.3 --strip-components=1 LLVM-23.1.3-Linux-X64/bin/clang LLVM-23.1.3-Linux-X64/bin/clang++ LLVM-23.1.3-Linux-X64/bin/clang-23 LLVM-23.1.3-Linux-X64/lib/clang LLVM-23.1.3-Linux-X64/include/llvm/Support/LICENSE.TXT
    - name: Register pinned Clang with asdf
      shell: bash
      run: |
        if ! asdf plugin list | grep -qx clang; then
        asdf plugin add clang https://github.com/higebu/asdf-llvm.git
        fi
        git -C /opt/asdf/plugins/clang checkout b7b8dd389c790237145e7436f1cd85b49611e37e
        asdf reshim clang
        asdf which clang++
        asdf exec clang++ --version
        echo /opt/asdf/shims >> "$GITHUB_PATH"
